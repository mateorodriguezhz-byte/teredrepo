    <link rel="stylesheet" href="./formulario.css">
</head>

<body>

<header>
    <a href="./formulario.html">
        <img src="./fotos/yoyo2.PNG" alt="Foto de perfil">
    </a>
    <h1>Adrian Mateo Rodriguez H.</h1>
</header>










<div class="content">




    <nav>


          <a href="./DatosPersonales.html">
        <img id="imgheader" src="./fotos/alien.png" alt="Icono usuario"> Datos Personales  </a>

        <a href="./datosAcademicos.html">
            <img src="./fotos/iconoeducacion.jpg" alt="Icono educación"> Datos Académicos    </a>

        <a href="./verDatos.html">
            <img src="./fotos/iconoeducacion.jpg" alt="Icono educación">   Ver Datos Guardados </a>

        <a href="./casa.html">
            <img src="./fotos/iconoeducacion.jpg" alt="Icono educación">   casa       </a>


    </nav>








                                            <main> 



        <h1>Datos Académicos</h1>



        <form id="formAcademicos">

            <label for="nc">Número de control:</label>
            <input id="nc" name="nc" type="text">
            <br><br>

            <label for="car">Carrera:</label>
            <input id="car" name="car" type="text">
            <br><br>

            <label for="esp">Especialidad:</label>
            <input id="esp" name="esp" type="text">
            <br><br>

            <label for="sem">Semestre:</label>
            <input id="sem" name="sem" type="text">
            <br><br>

            <label for="ce">Correo electrónico:</label>
            <input id="ce" name="ce" type="email">
            <br><br>

            <h2>Historial académico</h2>

            <table class="tabla-academica">
                <thead>
                    <tr>
                        <th>Años</th>
                        <th>Nivel</th>
                        <th>Certificado</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td><input name="anios_p1" type="text"></td>
                        <td><input name="nivel_p1" type="text"></td>
                        <td><input name="certificado_p1" type="text"></td>
                    </tr>

                    <tr>
                        <td><input name="anios_p2" type="text"></td>
                        <td><input name="nivel_p2" type="text"></td>
                        <td><input name="certificado_p2" type="text"></td>
                    </tr>

                    <tr>
                        <td><input name="anios_p3" type="text"></td>
                        <td><input name="nivel_p3" type="text"></td>
                        <td><input name="certificado_p3" type="text"></td>
                    </tr>

                    <tr>
                        <td><input name="anios_p4" type="text"></td>
                        <td><input name="nivel_p4" type="text"></td>
                        <td><input name="certificado_p4" type="text"></td>
                    </tr>

                    <tr>
                        <td><input name="anios_p5" type="text"></td>
                        <td><input name="nivel_p5" type="text"></td>
                        <td><input name="certificado_p5" type="text"></td>
                    </tr>
                </tbody>
            </table>

            <br>

            <button type="button" id="btnGuardar"
                style="padding: 10px 20px;
                background-color: #fc02bd;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;">
                Guardar Datos
            </button>

        </form>
    </main>

</div>

<script>
    const STORAGE_KEY = 'datosAcademicosEstudiante';

    document.getElementById('btnGuardar').addEventListener('click', () => {

        // Obtener los datos generales
        const datos = {
            nc: document.getElementById('nc').value,
            car: document.getElementById('car').value,
            esp: document.getElementById('esp').value,
            sem: document.getElementById('sem').value,
            ce: document.getElementById('ce').value,

            // Obtener los datos de la tabla
            historial: []
        };

        // Recorrer las cinco filas del historial académico
        for (let i = 1; i <= 5; i++) {
            datos.historial.push({
                anios: document.querySelector(`[name="anios_p${i}"]`).value,
                nivel: document.querySelector(`[name="nivel_p${i}"]`).value,
                certificado: document.querySelector(`[name="certificado_p${i}"]`).value
            });
        }

        // Guardar todos los datos en localStorage
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));

            alert('¡Datos académicos e historial guardados correctamente!');

            document.getElementById('formAcademicos').reset();

        } catch (error) {
            alert('No fue posible guardar los datos en el navegador.');
            console.error(error);
        }
    });
</script>

</body>
</html>
