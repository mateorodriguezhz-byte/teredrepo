                                                       <main>



    <h1>Datos Personales</h1>


    <form id="formPersonales">
        <label for="nombre">Nombre</label><input id="nombre" name="nombre" type="text"><br><br>
        <label for="apellido">Apellido</label><input id="apellido" name="apellido" type="text"><br><br>
        <label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="text"><br><br>
        <label for="direccion">Dirección</label><input id="direccion" name="direccion" type="text"><br><br>
        
        <button type="button" id="btnGuardarPersonales" style="padding: 10px 20px; background-color: #4f70be; color: white; border: none; border-radius: 4px; cursor: pointer;">Guardar Datos</button>
    </form>
                   








                                                      </main>
</div>
<script>
    const STORAGE_KEY_P = 'datosPersonalesEstudiante';

    document.getElementById('btnGuardarPersonales').addEventListener('click', () => {
        const datos = {
            nombre: document.getElementById('nombre').value,
            apellido: document.getElementById('apellido').value,
            telefono: document.getElementById('telefono').value,
            direccion: document.getElementById('direccion').value
        };

        localStorage.setItem(STORAGE_KEY_P, JSON.stringify(datos));
        alert('¡Datos personales guardados correctamente!');
        document.getElementById('formPersonales').reset();
    });
</script>
